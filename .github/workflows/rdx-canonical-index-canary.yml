name: CEREBRON F114 RDX Canonical Index Canary
on:
  push:
    branches: [main]
    paths:
      - 'config/rdx-canonical-index-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python worker/rdx_canonical_index_canary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f114-rdx-canonical-index-canary
          path: artifacts/rdx_canonical_index_canary.json
          if-no-files-found: error
